<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09092d">
<title data-i18n="title.admin">CX Quiz: admin</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
<script src="/js/locales.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body>

<!-- LOGIN -->
<section class="screen on" id="s-login">
  <div class="strip"><span class="dot idle"></span><span class="cell"><span class="v">CX Quiz</span></span><span class="spacer"></span><span class="cell"><span data-i18n="strip.adminConsole" class="k">admin console</span></span></div>
  <div class="stage center">
    <h1 data-i18n="admin.signInHeading">Admin sign in</h1>
    <div class="field u-w340">
      <label data-i18n="common.email" for="aEmail">Email</label>
      <input class="inp" id="aEmail" type="email" autocomplete="username">
    </div>
    <div class="field u-w340">
      <label data-i18n="common.password" for="aPw">Password</label>
      <input class="inp" id="aPw" type="password" autocomplete="current-password">
    </div>
    <p class="err" id="loginErr"></p>
    <button data-i18n="common.signIn" class="btn big" id="loginGo">Sign in</button>
  </div>
</section>

<!-- DASHBOARD (shared strip + tabs) -->
<section class="screen" id="s-dash">
  <div class="strip">
    <span class="dot idle"></span>
    <span class="cell"><span data-i18n="admin.brand" class="v">CX Quiz admin</span></span>
    <span class="spacer"></span>
    <span class="cell"><button data-i18n="admin.overview" class="k tab u-caps" data-tab="overview">Overview</button></span>
    <span class="cell"><button data-i18n="admin.hosts" class="k tab u-caps" data-tab="hosts">Hosts</button></span>
    <span class="cell"><button data-i18n="admin.categories" class="k tab u-caps" data-tab="categories">Categories</button></span>
    <span class="cell"><button data-i18n="admin.bank" class="k tab u-caps" data-tab="bank">Question bank</button></span>
    <span class="cell"><button data-i18n="common.signOut" class="k u-caps" id="logout">Sign out</button></span>
  </div>

  <!-- overview -->
  <div class="stage tabpage" id="tab-overview">
    <div><p data-i18n="admin.overview" class="eyebrow">Overview</p><h2 data-i18n="admin.overviewHeading">Everything running right now</h2></div>
    <div class="picker" id="statCards"></div>
    <hr class="divider">
    <div><p data-i18n="admin.recentGames" class="eyebrow">Recent games</p><h2 data-i18n="admin.acrossHosts">Across all hosts</h2></div>
    <div class="qlist" id="gamesList"></div>
  </div>

  <!-- hosts -->
  <div class="stage tabpage" id="tab-hosts">
    <div class="row between">
      <div><p data-i18n="admin.hosts" class="eyebrow">Hosts</p><h2 data-i18n="admin.hostsHeading">Who can run games</h2></div>
    </div>
    <div class="panel">
      <div class="editgrid">
        <div class="field">
          <label data-i18n="common.email" for="hEmail">Email</label>
          <input class="inp" id="hEmail" type="email" placeholder="host@company.com">
        </div>
        <div class="field">
          <label data-i18n="admin.playerLimit" for="hMax">Player limit</label>
          <input class="inp" id="hMax" type="number" min="1" max="2000" value="400">
        </div>
      </div>
      <div class="row"><button data-i18n="admin.createHost" class="btn" id="hCreate">+ Create host</button></div>
      <p class="note" id="hInviteNote"></p>
    </div>
    <div class="qlist" id="hostsList"></div>
  </div>

  <!-- categories -->
  <div class="stage tabpage" id="tab-categories">
    <div><p data-i18n="admin.categories" class="eyebrow">Categories</p><h2 data-i18n="admin.categoriesHeading">Organize the quiz library</h2></div>
    <div class="row">
      <input class="inp u-mw260" id="cName" placeholder="Category name" data-i18n-ph="admin.categoryName">
      <button data-i18n="admin.addCategory" class="btn" id="cCreate">+ Add category</button>
    </div>
    <div class="qlist" id="categoriesList"></div>
  </div>

  <!-- bank -->
  <div class="stage tabpage" id="tab-bank">
    <div class="row between">
      <div><p data-i18n="admin.bank" class="eyebrow">Question bank</p><h2 data-i18n="admin.bankHeading">Pre-written questions hosts can pull in</h2></div>
      <select class="inp u-mw260" id="bFilter"></select>
    </div>
    <div class="panel">
      <div class="field">
        <label data-i18n="common.question" for="bQ">Question</label>
        <textarea class="inp" id="bQ" rows="2" maxlength="200"></textarea>
      </div>
      <div class="editgrid">
        <div class="field">
          <label data-i18n="common.category" for="bCategory">Category</label>
          <select class="inp" id="bCategory"></select>
        </div>
        <div class="field">
          <label data-i18n="common.secondsToAnswer" for="bTime">Seconds to answer</label>
          <select class="inp" id="bTime"><option>10</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select>
        </div>
        <div class="field">
          <label data-i18n="common.answerOptions" for="bType">Answer options</label>
          <select class="inp" id="bType"><option data-i18n="common.fourChoices" value="4">Four choices</option><option data-i18n="common.trueFalse" value="2">True / false</option></select>
        </div>
      </div>
      <div class="qlist" id="bOpts"></div>
      <div class="row"><button data-i18n="admin.addToBank" class="btn" id="bAdd">+ Add to bank</button></div>
    </div>
    <div class="qlist" id="bankList"></div>
  </div>
</section>

<div class="offline" id="offline" hidden></div>

<button class="themetoggle" id="themeToggle" type="button" aria-label="Switch color theme" title="Switch color theme" data-i18n-aria="ui.theme" data-i18n-title="ui.theme">
  <svg class="ic-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="ic-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<script src="/js/admin.js"></script>
</body>
</html>
