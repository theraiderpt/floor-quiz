<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09092d">
<title data-i18n="title.invite">CX Quiz: set your password</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
<script src="/js/locales.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body>

<section class="screen on" id="s-invite">
  <div class="strip"><span class="dot idle"></span><span class="cell"><span class="v">CX Quiz</span></span><span class="spacer"></span><span class="cell"><span class="k" data-i18n="strip.hostInvite">host invite</span></span></div>
  <div class="stage center">
    <h1 data-i18n="invite.heading">Set your password</h1>
    <p class="sub" id="inviteWho"></p>

    <div id="inviteForm" hidden style="display:flex;flex-direction:column;gap:14px;align-items:center">
      <div class="field" style="width:min(340px,88vw)">
        <label for="pw1" data-i18n="invite.newPw">New password</label>
        <input class="inp" id="pw1" type="password" autocomplete="new-password">
      </div>
      <div class="field" style="width:min(340px,88vw)">
        <label for="pw2" data-i18n="invite.confirmPw">Confirm password</label>
        <input class="inp" id="pw2" type="password" autocomplete="new-password">
      </div>
      <p class="err" id="inviteErr"></p>
      <button class="btn big" id="inviteGo" data-i18n="invite.go">Set password and sign in</button>
    </div>

    <a class="btn ghost" id="toHost" href="/host" hidden data-i18n="invite.toHost">Go to host sign in</a>
  </div>
</section>

<button class="themetoggle" id="themeToggle" type="button" aria-label="Switch color theme" title="Switch color theme" data-i18n-aria="ui.theme" data-i18n-title="ui.theme">
  <svg class="ic-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="ic-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<script src="/js/invite.js"></script>
</body>
</html>
