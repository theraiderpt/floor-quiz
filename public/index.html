<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>Floor Quiz</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<section class="screen on" id="s-join">
  <div class="strip"><span class="dot idle" id="jDot"></span><span class="cell"><span class="v">Floor Quiz</span></span><span class="spacer"></span><span class="cell"><a href="/host" class="k" style="text-decoration:none">Host sign in</a></span></div>
  <div class="stage center">
    <p class="eyebrow">Enter the PIN on the screen</p>
    <div class="field" style="width:min(340px,88vw)">
      <label for="jPin">Game PIN</label>
      <input class="inp pin" id="jPin" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    </div>
    <div class="field" style="width:min(340px,88vw)">
      <label for="jName">Your name</label>
      <input class="inp" id="jName" maxlength="18" placeholder="First name and team" autocomplete="off">
    </div>
    <p class="err" id="jErr"></p>
    <button class="btn big" id="jGo">Join</button>
  </div>
</section>

<section class="screen" id="s-wait">
  <div class="strip"><span class="dot" id="wDot"></span><span class="cell"><span class="k">you</span><span class="v" id="wName">—</span></span><span class="spacer"></span><span class="cell"><span class="k">score</span><span class="v" id="wScore">0</span></span></div>
  <div class="stage center">
    <div class="pulse"></div>
    <h2 id="wMsg">You're in</h2>
    <p class="sub" id="wSub">Keep this screen open. The question appears here when the host starts.</p>
  </div>
</section>

<section class="screen" id="s-answer">
  <div class="strip"><span class="dot"></span><span class="cell"><span class="k">q</span><span class="v" id="aQn">1/1</span></span><span class="spacer"></span><span class="cell"><span class="k">time</span><span class="v" id="aClock">—</span></span><span class="cell"><span class="k">score</span><span class="v" id="aScore">0</span></span></div>
  <div class="stage" style="gap:14px">
    <p id="aQ" style="text-align:center;font-weight:600;line-height:1.35;font-size:clamp(15px,2.2vh,19px)">…</p>
    <div class="track"><div class="fill" id="aFill"></div></div>
    <div class="pad" id="aPad"></div>
  </div>
</section>

<section class="screen" id="s-result">
  <div class="strip"><span class="dot"></span><span class="cell"><span class="k">you</span><span class="v" id="rName">—</span></span><span class="spacer"></span><span class="cell"><span class="k">rank</span><span class="v" id="rRank">—</span></span></div>
  <div class="stage center">
    <p class="verdict" id="rVerdict">—</p>
    <p class="bigpts" id="rPts">+0</p>
    <p class="sub" id="rSub"></p>
  </div>
</section>

<section class="screen" id="s-final">
  <div class="strip"><span class="dot idle"></span><span class="cell"><span class="k">finished</span><span class="v" id="fName">—</span></span></div>
  <div class="stage center">
    <p class="eyebrow">That's the lot</p>
    <h1 id="fRank">—</h1>
    <p class="bigpts" id="fScore">0</p>
    <p class="sub" id="fSub"></p>
    <button class="btn ghost" id="fAgain">Join another game</button>
  </div>
</section>

<div class="offline" id="offline">Connection lost. Reconnecting…</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/play.js"></script>
</body>
</html>
