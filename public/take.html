<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09092d">
<title data-i18n="title.take">CX Quiz: self-paced</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
<script src="/js/locales.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body>

<section class="screen on" id="t-join">
  <div class="strip"><span class="dot idle"></span><span class="cell"><span class="v">CX Quiz</span></span><span class="spacer"></span><span class="cell"><span class="k" data-i18n="strip.selfPaced">self-paced</span></span></div>
  <div class="stage center">
    <p class="eyebrow" data-i18n="take.eyebrow">Self-paced test</p>
    <h1 id="tTitle">—</h1>
    <p class="sub" id="tIntro"></p>
    <div class="field u-w340">
      <label for="tName" data-i18n="common.yourName">Your name</label>
      <input class="inp" id="tName" maxlength="18" placeholder="First name and team" data-i18n-ph="common.namePh" autocomplete="off">
    </div>
    <div class="field u-w340" id="tEmailField" hidden>
      <label for="tEmail" data-i18n="common.workEmail">Work email</label>
      <input class="inp" id="tEmail" type="email" placeholder="you@company.com" data-i18n-ph="common.emailPh" autocomplete="email">
    </div>
    <p class="err" id="tErr"></p>
    <button class="btn big" id="tStart" data-i18n="take.start">Start</button>
  </div>
</section>

<section class="screen" id="t-question">
  <div class="strip"><span class="dot idle"></span><span class="cell"><span class="k" data-i18n="strip.question">question</span><span class="v" id="tQn">1/1</span></span><span class="spacer"></span><span class="cell"><span class="k" data-i18n="strip.score">score</span><span class="v" id="tScore">0</span></span></div>
  <div class="stage u-gap14">
    <p class="qprompt" id="tQ">…</p>
    <img id="tImg" class="qimg compact" hidden alt="">
    <p class="note u-tc" id="tHint" hidden></p>
    <div class="pad" id="tPad"></div>
    <p class="err u-tc" id="tQErr" role="alert"></p>
  </div>
</section>

<section class="screen" id="t-feedback">
  <div class="strip"><span class="dot idle"></span><span class="cell"><span class="k" data-i18n="strip.score">score</span><span class="v" id="fbScore">0</span></span></div>
  <div class="stage center">
    <p class="verdict" id="fbVerdict">—</p>
    <p class="bigpts" id="fbPts">+0</p>
    <p class="sub" id="fbSub"></p>
    <button class="btn big" id="fbNext"></button>
  </div>
</section>

<section class="screen" id="t-final">
  <div class="strip"><span class="dot idle"></span><span class="cell"><span class="k" data-i18n="strip.finished">finished</span><span class="v" id="finName">—</span></span></div>
  <div class="stage center">
    <p class="eyebrow" data-i18n="common.thatsTheLot">That's the lot</p>
    <h1 data-i18n="take.allDone">All done</h1>
    <p class="bigpts" id="finScore">0</p>
    <p class="sub" id="finSub"></p>
    <button class="btn ghost" id="finAgain" data-i18n="take.again">Take it again</button>
  </div>
</section>

<button class="soundtoggle" data-sound-toggle type="button" aria-label="Mute sound effects" title="Mute sound effects" data-i18n-aria="ui.sound" data-i18n-title="ui.sound">🔊</button>
<button class="themetoggle" id="themeToggle" type="button" aria-label="Switch color theme" title="Switch color theme" data-i18n-aria="ui.theme" data-i18n-title="ui.theme">
  <svg class="ic-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="ic-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<script src="/js/sound.js"></script>
<script src="/js/take.js"></script>
</body>
</html>
