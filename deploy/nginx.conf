# /etc/nginx/sites-available/floor-quiz
# Domain: cxquiz.tech
#
# Installed for you by deploy/setup.sh. Nothing to edit by hand.
# Certbot rewrites this file to add the TLS block and the port 80 redirect.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Send www to the apex so there is one canonical address on the projector.
server {
    listen 80;
    listen [::]:80;
    server_name www.cxquiz.tech;
    return 301 http://cxquiz.tech$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cxquiz.tech;

    client_max_body_size 2m;

    access_log /var/log/nginx/floor-quiz.access.log;
    error_log  /var/log/nginx/floor-quiz.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # These two lines are what make WebSockets work. Without them
        # socket.io silently degrades to polling, or fails outright.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A question can stay open for 120 seconds. The default 60s read
        # timeout would cut idle sockets mid-question.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
